<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14141f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cleomania">
<title>Cleomania</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/PressStart2P.woff2) format('woff2');font-display:block}
:root{--pad:min(23vmin,118px);--gap:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14141f;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.pad{position:fixed;display:none;align-items:center;justify-content:center;flex-direction:column;gap:7px;
  width:var(--pad);height:var(--pad);border:3px solid rgba(255,255,255,.8);background:rgba(20,20,35,.3);
  color:#fff;font:9px 'Press Start 2P',monospace;text-shadow:1px 1px 0 #000;
  box-shadow:0 4px 0 rgba(0,0,0,.35);touch-action:none;
  bottom:calc(var(--gap) + env(safe-area-inset-bottom))}
.pad.on{background:rgba(255,255,255,.38);transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#bBrake{left:calc(var(--gap) + env(safe-area-inset-left))}
#bGas{right:calc(var(--gap) + env(safe-area-inset-right))}
#bBoost{right:calc(var(--gap) + env(safe-area-inset-right));height:calc(var(--pad)*.55);
  bottom:calc(var(--gap)*2 + var(--pad) + env(safe-area-inset-bottom));opacity:.55}
#bBoost.ready{opacity:1;background:#ffb703;color:#1b1b1b;text-shadow:none;animation:pulse .5s steps(2) infinite}
#bBoost.active{opacity:1;background:#ff4fa3;animation:none}
@keyframes pulse{50%{background:#fff3b0}}
.ccw{font:bold 34px/1 system-ui,sans-serif;color:#fff}
body.play .pad{display:flex}
#top{position:fixed;bottom:calc(var(--cpx,2px)*15);left:50%;transform:translateX(-50%);display:flex;gap:8px} /* just above the CLEOMANIA label */
.sm{width:34px;height:30px;border:2px solid rgba(255,255,255,.8);background:rgba(20,20,35,.35);color:#fff;
  font:9px 'Press Start 2P',monospace;padding:0;touch-action:none}
#bPause{display:none}
body.play #bPause{display:block}
@media (hover:hover) and (pointer:fine){.pad{opacity:.6}#bBoost.ready,#bBoost.active{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><button id="bMute" class="sm">SND</button><button id="bMus" class="sm">MUS</button><button id="bPause" class="sm">II</button></div>
<div id="bBrake" class="pad"><b class="ccw">&#8634;</b><span>BRAKE</span></div>
<div id="bBoost" class="pad"><span id="boostLbl">BOOST</span></div>
<div id="bGas" class="pad"><b class="ccw">&#8635;</b><span>PEDAL</span></div>
<script>
(()=>{
'use strict';
// ================= canvas & scaling =================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=320,H=180,Hc=100,buf=new Float32Array(2048);
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const vw=window.innerWidth,vh=window.innerHeight,pw=vw*dpr,ph=vh*dpr;
  const s=vw>=vh?Math.max(1,Math.floor(ph/185)):Math.max(1,Math.floor(pw/250));
  W=Math.ceil(pw/s);H=Math.ceil(ph/s);
  cv.width=W;cv.height=H;
  cv.style.width=(W*s/dpr)+'px';cv.style.height=(H*s/dpr)+'px';
  document.documentElement.style.setProperty('--cpx',(s/dpr)+'px'); // size of one canvas pixel, for the menu position
  Hc=Math.round(H*0.64);
  if(buf.length<W)buf=new Float32Array(W+64);
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();

// ================= helpers =================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash(i,s){let h=Math.imul(i|0,0x27d4eb2d)^Math.imul((s|0)+0x3c6ef372|0,0x165667b1);
  h^=h>>>15;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return (h>>>0)/4294967296;}
function noise(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f),a=hash(i,s);return (a+(hash(i+1,s)-a)*u)*2-1;}
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;

// ================= biomes =================
const ALPS=0,FOREST=1,DESERT=2,COAST=3,NB=4,AACHEN=4; // NB: biomes in the endless loop; Aachen only starts the ride
const BIO=[
 {name:'THE ALPS',  skyT:[78,150,222], skyB:[206,236,255],top:[86,168,78], edge:[150,214,120],soil:[121,85,50], dark:[88,60,34]},
 {name:'THE FOREST',skyT:[92,162,196], skyB:[214,236,212],top:[62,128,56], edge:[112,172,82], soil:[92,64,40],  dark:[64,42,24]},
 {name:'THE DESERT',skyT:[236,140,84], skyB:[255,228,168],top:[234,186,98],edge:[255,226,150],soil:[212,148,78],dark:[176,112,56]},
 {name:'THE COAST', skyT:[56,160,220], skyB:[192,240,255],top:[238,214,160],edge:[255,246,210],soil:[204,168,108],dark:[164,128,76]},
 {name:'AACHEN',    skyT:[92,146,206], skyB:[212,228,240],top:[150,146,140],edge:[192,188,180],soil:[112,96,82], dark:[80,68,58]},
];
// transition zones: Alps->Forest foothills, Forest->Desert savanna, Desert->Coast beach dunes, Coast->Alps lakeside meadow
const TRP=[
 {top:[96,150,70],  edge:[150,200,110],soil:[110,78,48], dark:[80,56,32], skyT:[84,156,214], skyB:[214,238,240]},
 {top:[170,162,82], edge:[212,200,118],soil:[168,120,70],dark:[130,90,50], skyT:[196,150,120],skyB:[255,224,176]},
 {top:[228,206,150],edge:[250,236,196],soil:[200,168,110],dark:[160,128,80],skyT:[110,168,214],skyB:[255,228,190]},
 {top:[110,170,90], edge:[170,215,130],soil:[130,100,70],dark:[96,72,48], skyT:[70,152,222], skyB:[204,236,255]},
 {top:[92,152,74],  edge:[146,202,112],soil:[114,82,52], dark:[84,58,36], skyT:[84,150,214], skyB:[212,234,246]}, // Aachen->Forest: Eifel hills
];
function gpal(a,b,t,k){const A=BIO[a][k],B=BIO[b][k],T=TRP[a][k];return t<0.5?mix(A,T,t*2):mix(T,B,(t-0.5)*2);}
const rgbCache=new Map();
function rgbc(a){const key=((a[0]|0)<<16)|((a[1]|0)<<8)|(a[2]|0);let v=rgbCache.get(key);
  if(!v){if(rgbCache.size>5000)rgbCache.clear();v=rgb(a);rgbCache.set(key,v);}return v;}
const BL=11700,BBL=1900,AL=6000; // biome length, transition length, length of the Aachen start (kept short)
let bA=0,bB=1,bT=0;
const LOOP0=FOREST; // every ride starts in Aachen, then loops Forest -> Desert -> Coast -> Alps -> Forest ...
function biome(x){
  if(x<AL){bA=AACHEN;bB=LOOP0;bT=sstep(AL-BBL,AL,x);return;}
  x-=AL;const seg=Math.floor(x/BL),loc=x-seg*BL;bA=(((seg+LOOP0)%NB)+NB)%NB;bB=(bA+1)%NB;bT=sstep(BL-BBL,BL,loc);
}
const loopAt=b=>AL+((b-LOOP0+NB)%NB)*BL;                       // world x where biome b first begins
const segOf=x=>x<AL?-1:Math.floor((x-AL)/BL);                 // -1 = Aachen, then 0,1,2... along the loop
const segName=sg=>BIO[sg<0?AACHEN:(sg+LOOP0)%NB].name;

// ================= climate =================
// One continuous world described by values that drift along the track (all 0..1):
// elev = mountainous, moist = dry..lush, temp = cold..hot, sea = at the sea, urban = city, arid = desert-ness (derived).
// Ground colours and scenery are functions of these values, so regions blend without seams.
// Biome IDs still drive the terrain heights, background shapes and the banner text.
//            elev moist temp  sea urban
const CLIM =[[.90,.60,.08,0,0],[.40,.82,.42,0,0],[.35,.07,.92,0,0],[.05,.45,.70,1,0],[.25,.70,.40,0,1]];      // biome cores
const CLIMT=[[.55,.72,.30,0,0],[.30,.32,.70,0,0],[.12,.22,.80,.7,0],[.45,.65,.28,.2,0],[.38,.80,.36,0,.12]]; // foothills, savanna, dunes, lakeside, Eifel
let pE=0,pM=0,pT=0,pS=0,pU=0,pA=0;
// quadratic curve from a to b that passes through m halfway: smooth, no kink at the midpoint
const bez=(a,m,b,t)=>{const c=2*m-(a+b)/2,u=1-t;return u*u*a+2*u*t*c+t*t*b;};
const bump=(v,lo,hi,s=0.1)=>sstep(lo-s,lo,v)*(1-sstep(hi,hi+s,v));
function climate(x){ // sets pE,pM,pT,pS,pU,pA (and bA,bB,bT)
  biome(x);const A=CLIM[bA],B=CLIM[bB],M=CLIMT[bA],t=bT;
  pE=clamp(bez(A[0],M[0],B[0],t)+0.06*noise(x/1400,SEED+701)+0.03*noise(x/280,SEED+702),0,1);
  pM=clamp(bez(A[1],M[1],B[1],t)+0.05*noise(x/1300,SEED+703)+0.035*noise(x/260,SEED+704),0,1);
  pT=clamp(bez(A[2],M[2],B[2],t)+0.05*noise(x/1600,SEED+705),0,1);
  pS=clamp(bez(A[3],M[3],B[3],t),0,1);
  pU=clamp(bez(A[4],M[4],B[4],t),0,1);
  pA=sstep(0.25,0.05,pM)*sstep(0.6,0.88,pT)*(1-pS);
}
// ground colours: the tuned biome and transition palettes sit at their climate in (elev, moist, temp, sea)
// space and are blended by closeness, so each core keeps its look and the colours follow the local climate in between
const GANCH=[...CLIM.map((c,i)=>[c,BIO[i]]),...CLIMT.map((c,i)=>[c,TRP[i]])];
const gTop=[0,0,0],gEdge=[0,0,0],gSoil=[0,0,0],gDark=[0,0,0];
function groundPal(){ // from the current pE,pM,pT,pS,pU
  let ws=0;gTop.fill(0);gEdge.fill(0);gSoil.fill(0);gDark.fill(0);
  for(const [c,P] of GANCH){
    const d2=0.5*(pE-c[0])**2+(pM-c[1])**2+(pT-c[2])**2+1.5*(pS-c[3])**2+2*(pU-c[4])**2,w=1/(d2*d2*d2+1e-9);ws+=w;
    for(let k=0;k<3;k++){gTop[k]+=P.top[k]*w;gEdge[k]+=P.edge[k]*w;gSoil[k]+=P.soil[k]*w;gDark[k]+=P.dark[k]*w;}
  }
  for(let k=0;k<3;k++){gTop[k]/=ws;gEdge[k]/=ws;gSoil[k]/=ws;gDark[k]/=ws;}
}
function regionName(){ // debug label for the current climate
  if(pU>0.5)return 'AACHEN';if(pU>0.05)return 'EIFEL';if(pS>0.6)return 'COAST';if(pA>0.55)return 'CANYON';if(pE>0.7&&pT<0.3)return 'ALPS';
  if(pM>0.55)return pE<0.62?'FOREST':'FOOTHILLS';if(pT>0.5)return pS<0.3?'SAVANNA':'DUNES';return 'MEADOW';
}

// ================= terrain =================
let SEED=1;
function rampF(x,s,prob){
  const c=Math.floor(x/600);if(c<1)return 0;if(c<5)prob=Math.max(prob,0.75);if(hash(c,s)>prob)return 0;
  const p=x-c*600,st=150+hash(c,s+1)*280,len=60+hash(c,s+2)*25,ht=28+hash(c,s+3)*14,q=p-st;
  if(q<0||q>len+22)return 0;
  if(q<len){const k=q/len;return ht*k*k;}
  const d=(q-len)/22;return ht*(1-d*d*(3-2*d));
}
function hb(b,x){
  const s=SEED;x=x+140*noise(x/1700,s+7); // domain warp: hills bunch up and spread out
  if(b===ALPS)return 50*noise(x/270,s+11)+14*noise(x/90,s+12)+90*noise(x/1150,s+13)+2*noise(x/25,s+14);
  if(b===FOREST)return 26*noise(x/230,s+41)+7*noise(x/85,s+42)+55*noise(x/900,s+43)+1*noise(x/22,s+44); // rolling, not bumpy
  if(b===DESERT)return 32*noise(x/210,s+21)+11*noise(x/66,s+22)+45*noise(x/950,s+23);
  if(b===AACHEN)return 22*noise(x/260,s+51)+8*noise(x/80,s+52)+30*noise(x/1000,s+53); // gentle city hills
  return 19*noise(x/240,s+31)+6*noise(x/75,s+32)+28*noise(x/1000,s+33);
}
function rampsOf(b,x){return b===ALPS?rampF(x,SEED+15,0.3):b===FOREST?rampF(x,SEED+45,0.45):b===DESERT?rampF(x,SEED+25,0.35):b===AACHEN?rampF(x,SEED+55,0.45):rampF(x,SEED+35,0.6);}
function terrainH(x){
  const m=sstep(150,900,x)*(0.85+Math.min(x/40000,0.35));
  if(m===0)return 0;
  biome(x);let h=hb(bA,x),r=rampsOf(bA,x);if(bT>0){h=lerp(h,hb(bB,x),bT);r=lerp(r,rampsOf(bB,x),bT);}
  return h*m+r*Math.min(1,m*2);
}
const slope=x=>terrainH(x+0.5)-terrainH(x-0.5);

// ================= sprites =================
const PAL={d:'#1e5a2c',g:'#2f7d3a',G:'#5cb85c',t:'#7a4a28',T:'#4a2d1a',l:'#c3c8cf',r:'#8a8f98',R:'#5f646d',
 c:'#3a9d4f',C:'#287238',k:'#222222',w:'#ffffff',n:'#6b3e26',f:'#b07cd8',y:'#ffd23f',e:'#e63946',b:'#9b6a3a',h:'#c98b5a',H:'#9c6640',B:'#3fa7d6',o:'#e8892f',D:'#174a24',s:'#d9b48a'};
function spr(rows){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,y,1,1);}}});
  return c;
}
const SPR={
 light:spr(["..y..",".kkk.",".eee.",".www.",".eee.",".www.",".eee.","wwwww"]),
 sail:spr(["..w...","..ww..","..www.","..wwww","bbbbbb",".bbbb."]),
};
Object.assign(SPR,{
 ship:spr([".......w........","......ww.ww.....",".....www.www....","....wwww.wwww...","........k.......","eeeeeeeeeeeeeeee",".kkkkkkkkkkkkkk."]),
 balloon:spr(["..eye..",".eyeye.","eyeyeye","eyeyeye",".eyeye.","..eye..","...k...","..k.k..","..bbb..","..bbb.."]),
 balloon2:spr(["..BwB..",".BwBwB.","BwBwBwB","BwBwBwB",".BwBwB.","..BwB..","...k...","..k.k..","..bbb..","..bbb.."]),
 glider:spr([".eeyyyee.","e.......e",".k.....k.","..k...k..","...kbk...","....b...."]),
});
const flipCache=new Map();
function flipped(sp){let f=flipCache.get(sp);if(!f){f=document.createElement('canvas');f.width=sp.width;f.height=sp.height;const x=f.getContext('2d');x.translate(sp.width,0);x.scale(-1,1);x.drawImage(sp,0,0);flipCache.set(sp,f);}return f;}
const DSCALE=1.75; // canvas px per pixel of the scenery sprites (drawn in 2× detail)
PAL.a='#c4623a';PAL.A='#8f4228';
SPR.archMid=spr(["....aaaaaaaaaa....","..aaaAaaaaaaAaaa..",".aaAaa......aaAaa.",".aAa..........aAa.","aaA............Aaa","aAa............aAa","aaa............aaa","aAa............aAa","aaA............Aaa","AAa............aAA","AAAa..........aAAA"]);
SPR.heart=spr([".ee.ee.","eweeeee","eeeeeee",".eeeee.","..eee..","...e..."]);
SPR.heartX=spr([".RR.RR.","RRRRRRR","RRRRRRR",".RRRRR.","..RRR..","...R..."]);
// Aachen skyline landmarks, painted with rectangles; .tops = first opaque row per column (for the haze)
function paint(w,h,f){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  f((px,py,pw,ph,col)=>{x.fillStyle=col;x.fillRect(px,py,pw,ph);});
  const d=x.getImageData(0,0,w,h).data;c.tops=new Int16Array(w).fill(h);
  for(let i=0;i<w;i++)for(let j=0;j<h;j++)if(d[(j*w+i)*4+3]){c.tops[i]=j;break;}
  return c;
}
const STONE='#9b9483',STONED='#7d7768',SLATE='#4e5668',GOLD='#d6b04c',GLASS='#6d86a8';
SPR.dom=paint(40,46,r=>{ // Aachen Cathedral: west tower, Carolingian octagon with dome, Gothic glass choir
  r(3,18,6,28,STONED);r(3,14,6,4,SLATE);r(4,9,4,5,SLATE);r(5,4,2,5,SLATE);r(5,1,1,3,GOLD);
  r(4,22,1,4,'#3a3f4c');r(7,22,1,4,'#3a3f4c');r(5,32,2,5,'#3a3f4c');
  r(9,24,14,22,STONE);r(11,20,10,4,STONED);r(11,15,10,5,SLATE);r(13,12,6,3,SLATE);r(15,10,2,2,SLATE);r(15,7,2,3,STONE);r(16,5,1,2,GOLD);
  for(const wx of [11,15,19])r(wx,28,2,5,GLASS);
  r(23,18,17,28,'#a7a090');r(23,14,17,4,SLATE);r(25,12,13,2,SLATE);r(31,9,1,3,SLATE);
  for(let k=0;k<4;k++)r(25+k*4,21,2,20,GLASS);
  for(let k=0;k<5;k++)r(23+k*4,20,1,26,STONED);
  r(0,44,40,2,STONED);
});
SPR.rathaus=paint(36,34,r=>{ // town hall with its two towers
  r(5,14,26,20,'#a3927a');r(5,10,26,4,SLATE);r(7,8,22,2,SLATE);
  for(let k=0;k<6;k++){r(7+k*4,17,2,5,GLASS);r(7+k*4,26,2,5,GLASS);}
  r(0,10,6,24,'#8f8574');r(0,7,6,3,SLATE);r(1,4,4,3,SLATE);r(2,1,2,3,SLATE);r(2,0,1,1,GOLD);
  r(30,7,6,27,'#8f8574');r(30,4,6,3,SLATE);r(31,1,4,3,SLATE);r(32,0,2,1,GOLD);
  r(2,14,2,3,GLASS);r(32,12,2,3,GLASS);
});
SPR.superc=paint(28,30,r=>{ // RWTH SuperC: glass block whose upper floors cantilever out
  r(2,10,10,20,'#8ea3b8');r(2,2,25,10,'#8ea3b8');
  for(let y=4;y<30;y+=3)r(2,y,y<12?25:10,1,'#66788c');
  r(12,12,15,1,'#4a5768');r(0,29,28,1,'#66788c');
});
SPR.castle=paint(28,22,r=>{ // castle ruin for a forest hilltop: keep, broken curtain wall, round tower, ivy
  const S='#948e80',D='#716b60',K='#3e3b36',V='#3f6e45';
  r(4,4,8,18,S);r(10,4,2,18,D);r(4,2,2,2,S);r(7,2,2,2,S);r(10,2,2,2,D);r(6,1,1,1,S); // keep, its top broken off at the left
  r(6,7,1,2,K);r(8,12,1,2,K);r(6,16,1,2,K);
  r(12,12,4,10,S);r(16,14,3,8,S);r(19,11,3,11,S);r(13,11,2,1,S);r(20,10,1,1,S);  // curtain wall with gaps
  r(15,17,2,5,K);                                                                   // gate
  r(22,7,5,15,S);r(25,7,2,15,D);r(22,6,1,1,S);r(24,6,1,1,S);r(26,6,1,1,D);r(23,11,1,2,K); // round tower
  r(4,15,2,5,V);r(5,13,1,3,V);r(12,18,3,4,V);r(19,16,2,6,V);r(22,17,1,5,V);r(0,20,28,2,'#4c8a56');
});
// ================= scenery sprites (2× detail) =================
// Painted in code with materials. One shading pass lights every sprite the same way: a lit rim towards the upper left,
// a dark rim towards the lower right, shade under overhangs, and each material's own texture (leaf clumps, bark, boards...).
const hx=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const hh=(i,j,s)=>hash(i*92821+j*68917,s);
function mat(cols,tex,o){return Object.assign({c:cols.map(hx),tex},o);} // 5 tones: rim, dark, base, light, highlight

const TX={

  needle:(i,j)=>{const r=hh(i,j,9102);return r<0.08?-1:r>0.95?1:0;},

function art(w,h,f){
  const M=new Int16Array(w*h).fill(-1),T=new Int8Array(w*h),mats=[];let under=false;
  const P={w,h,
    put(x,y,m,t=0){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=w||y>=h)return;const k=y*w+x;
      if(under&&M[k]>=0)return;if(m===null){M[k]=-1;return;}let id=mats.indexOf(m);if(id<0)id=mats.push(m)-1;M[k]=id;T[k]=t;},
    tone(x,y,t){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<w&&y<h&&M[y*w+x]>=0)T[y*w+x]=t;}, // re-tone a painted pixel
    has:(x,y)=>x>=0&&y>=0&&x<w&&y<h&&M[y*w+x]>=0,
    under(v){under=v;},                                   // true: only paint empty pixels (things behind)
    rect(x,y,rw,rh,m,t){for(let j=y;j<y+rh;j++)for(let i=x;i<x+rw;i++)P.put(i,j,m,t);},
    ell(cx,cy,rx,ry,m,t){for(let j=Math.floor(cy-ry);j<=Math.ceil(cy+ry);j++)for(let i=Math.floor(cx-rx);i<=Math.ceil(cx+rx);i++){
      const dx=(i+0.5-cx)/rx,dy=(j+0.5-cy)/ry;if(dx*dx+dy*dy<=1)P.put(i,j,m,t);}},
    poly(pts,m,t){const ys=pts.map(p=>p[1]);
      for(let j=Math.floor(Math.min(...ys));j<=Math.ceil(Math.max(...ys));j++){const yc=j+0.5,xs=[];
        for(let k=0;k<pts.length;k++){const [x0,y0]=pts[k],[x1,y1]=pts[(k+1)%pts.length];if((y0<=yc)!==(y1<=yc))xs.push(x0+(yc-y0)/(y1-y0)*(x1-x0));}
        xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2)for(let i=Math.ceil(xs[k]-0.5);i+0.5<=xs[k+1];i++)P.put(i,j,m,t);}},
    line(x0,y0,x1,y1,m,t=0,wd=1){const n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)));
      for(let k=0;k<=n;k++){const x=lerp(x0,x1,k/(n||1)),y=lerp(y0,y1,k/(n||1));P.rect(Math.floor(x-(wd-1)/2),Math.floor(y-(wd-1)/2),wd,wd,m,t);}},
    curve(x0,y0,cx,cy,x1,y1,m,t=0,wd=1){let px=x0,py=y0;for(let k=1;k<=12;k++){const s=k/12,a=(1-s)*(1-s),b=2*s*(1-s),c=s*s,
      x=a*x0+b*cx+c*x1,y=a*y0+b*cy+c*y1;P.line(px,py,x,y,m,t,wd);px=x;py=y;}},
  };
  f(P);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),img=x.createImageData(w,h),d=img.data;
  const at=(i,j)=>i<0||j<0||i>=w||j>=h?-1:M[j*w+i];
  const same=(i,j,m)=>{const q=at(i,j);return q===m||(q>=0&&mats[q].flat&&!mats[m].flat);}; // details don't break a surface
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const k=j*w+i,m=M[k];if(m<0)continue;const mt=mats[m];let t=2+T[k];
    if(!mt.flat){
      if(mt.tex)t+=mt.tex(i,j);
      if(!same(i-1,j-1,m)||!same(i,j-1,m))t+=1;                // lit rim, upper left
      else if(mt.soft&&(!same(i-2,j-2,m)))t+=1;
      if(!same(i+1,j+1,m)||!same(i+1,j,m))t-=1;                // shaded rim, lower right
      if(at(i,j+1)<0||at(i+1,j)<0)t=Math.min(t,1);           // outline against the background
      const up=at(i,j-1);if(up>=0&&up!==m&&mats[up].cast)t-=1; // shadow under roofs and crowns
    }
    const col=mt.c[clamp(Math.round(t),0,4)];d[k*4]=col[0];d[k*4+1]=col[1];d[k*4+2]=col[2];d[k*4+3]=255;
  }
  x.putImageData(img,0,0);return c;
}

function conifer(w,h,tiers,trunk,lf){return art(w,h,P=>{
  const cx=w/2,top=0,bot=h-trunk;
  P.rect(Math.floor(cx)-1,bot-2,2,h-bot+2,HM.bark);
  for(let k=tiers-1;k>=0;k--){ // bottom layer first; each layer above overlaps it with drooping tips and a dark underside
    const b=top+(bot-top)*(k+1)/tiers,a=Math.max(top,b-(bot-top)/tiers*1.8),hw=(w/2)*(0.32+0.68*(k+1)/tiers);
    for(let i=Math.floor(cx-hw);i<Math.ceil(cx+hw);i++){
      const x=i+0.5-cx,u=Math.abs(x)/hw,yb=Math.round(b+1.5*u*u-(hh(i,k,9120)<0.3?1:0)),ya=a+(b-a)*Math.min(1,u*1.1);
      for(let j=Math.floor(ya);j<yb;j++)P.put(i,j,lf,j===yb-1?-1:x<-1.5&&j<yb-2?1:x>1?-0.6:0);
    }
  }
  P.put(cx-0.5,0,lf,1);
});}

function rearAxle(){const ca=Math.cos(bike.a),sa=Math.sin(bike.a);return [bike.x-11*ca+7*sa,bike.y-11*sa-7*ca];}

function phys(dt){
  const b=bike,live=state==='play';
  const gas=live&&input.gas,brk=(live&&input.brake)||state==='win'; // celebrating: coast to a stop
  const [fF,fP]=rider==='woman'?[1.05,1.14]:[1,1]; // easter egg: she's 5% faster (1.14x power = +5% top speed against drag and rolling)
  let ca=Math.cos(b.a),sa=Math.sin(b.a);
  let fx=0,fy=-G,tq=0,any=false,gtx=1,gty=0,clr=1e9; // clr: lowest wheel's height above the ground
  slamCD=Math.max(0,slamCD-dt);
  for(let i=0;i<2;i++){
    const wh=wheels[i];
    const rx=wh.ox*ca-wh.oy*sa,ry=wh.ox*sa+wh.oy*ca,cx=b.x+rx,cy=b.y+ry;
    const gy=terrainH(cx),sl=slope(cx),nl=Math.hypot(1,sl),nx=-sl/nl,ny=1/nl;
    const pen=wh.r-(cy-gy)*ny;
    wh.c=pen>-0.4;clr=Math.min(clr,-pen);
    if(pen>0){
      any=true;
      const qx=rx-nx*wh.r,qy=ry-ny*wh.r;
      const vn=(b.vx-b.w*qy)*nx+(b.vy+b.w*qx)*ny;
      let Fn=K*pen-CD*vn;if(Fn<0)Fn=0;
      const tx=ny,ty=-nx;
      const vt=(b.vx-b.w*ry)*tx+(b.vy+b.w*rx)*ty;
      let lim=MU*Fn;
      if(i===0&&tx<0.93&&ty>0&&vt<70)lim*=1+2*clamp((70-vt)/70,0,1); // grip assist on steep climbs
      const Fr=-Math.sign(vt)*Math.min(Math.abs(vt)*3,ROLL);
      const Fd=(i===0&&gas)?Math.min(FMAX*fF,POWER*fP/Math.max(25,vt),lim):0;
      const Fb=brk?-Math.sign(vt)*Math.min(Math.abs(vt)*12,BRAKE,MU*Fn):0; // brakes slow down, never push back
      const Ft=Fr+Fd+Fb;
      fx+=Fn*nx+Ft*tx;fy+=Fn*ny+Ft*ty;
      tq+=qx*Fn*ny-qy*Fn*nx;
      tq+=rx*Fr*ty-ry*Fr*tx; // pedalling and braking push only, they never tilt the bike
      wh.vt=vt;wh.om=vt/wh.r;
      if(i===0){gtx=tx;gty=ty;}
    }
  }
  if(!wheels[0].c&&gas)wheels[0].om=Math.max(wheels[0].om,30);
  for(const wh of wheels){if(!wh.c)wh.om*=0.999;wh.spin-=wh.om*dt;}
  if(gas)crank-=dt*(wheels[0].c?Math.max(5,wheels[0].vt/5.5*0.55):10);

  const sp=Math.hypot(b.vx,b.vy);
  fx-=DRAG*b.vx*sp;fy-=DRAG*b.vy*sp;
  if(boostOn>0&&(any||tr.g)&&b.vx<380){fx+=BOOST_F*gtx;fy+=BOOST_F*gty;}
  if(momT>0&&any&&b.vx<460){fx+=momF*gtx;fy+=momF*gty;} // landing momentum
  let al=tq/I;
  if(any)relT=0;
  // pedal and brake only start flipping once the wheels have cleared the ground by AIR_H, so bumps never flip the bike;
  // once cleared, flipping stays possible until the landing
  airOK=!any&&(airOK||clr>AIR_H);
  // flip speed ramps up gently with the time the button has been held in the air (from 0 to full in FLIP_RAMP s);
  // releasing, switching direction or landing starts the ramp again
  const fb=live&&input.brake; // the automatic celebration brake never flips the bike
  const dir=!any&&airOK&&gas!==fb?(gas?-1:1):0;
  if(dir!==flipDir){flipDir=dir;flipT=0;}else if(dir)flipT+=dt;
  if(!any&&!airOK&&gas!==fb){} // too close to the ground: a single button doesn't turn the bike
  else if(!any){
    // in the air: PEDAL turns the bike clockwise (frontflip), BRAKE counter-clockwise (backflip), at a steady rate;
    // releasing stops the rotation at once. Both near the ground: slam down, nose along the slope.
    if(!(gas&&fb))slam=false;
    if(gas&&fb&&clr<SLAM_H&&(slam||slamCD<=0)){ // after a slam, the next one is blocked for SLAM_CD seconds
      if(!slam)slamCD=SLAM_CD;
      slam=true;b.vy=Math.min(b.vy,-SLAM_V);al=0;relT=0;
      let d=b.a-Math.atan(slope(b.x+Math.max(0,b.vx)*0.05));d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
      b.w=clamp(-d*14,-FLIP_W,FLIP_W);
    }
    else if(gas!==fb){b.w=flipDir*FLIP_W*sstep(0,FLIP_RAMP,flipT);al=0;relT=0;}
    else if(boostOn>0){ // still held by the pusher: stays level
      let d=b.a-Math.atan2(clamp(b.vy,-0.6*b.vx,0.6*b.vx),Math.max(1,b.vx));d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
      al+=-d*16-b.w*5;
    }
    else{
      relT+=dt;al=0;b.w=0;
      if(relT>0.3){ // gentle, delayed settle toward the ground you'll land on
        let d=b.a-(Math.atan(slope(b.x+Math.max(0,b.vx)*0.25))-0.4);d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
        if(Math.abs(d)<1.6&&d>0.04)b.w=clamp(-d*3,-1.6,0)*Math.min(1,(relT-0.3)/0.25); // only settles nose-down, stops ~0.4 rad short
      }
    }
  }
  else{
    if(boostOn>0){ // the pusher keeps the bike steady
      let d=b.a-Math.atan2(gty,gtx);d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
      al+=-d*28-b.w*5;
    }
  }
  b.vx+=fx*dt;b.vy+=fy*dt;b.w=clamp(b.w+al*dt,-11,11);
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;

  // hard contact (prevents tunnelling on big landings)
  ca=Math.cos(b.a);sa=Math.sin(b.a);
  for(const wh of wheels){
    const rx=wh.ox*ca-wh.oy*sa,ry=wh.ox*sa+wh.oy*ca,cx=b.x+rx,cy=b.y+ry;
    const gy=terrainH(cx),sl=slope(cx),nl=Math.hypot(1,sl),nx=-sl/nl,ny=1/nl;
    const pen=wh.r-(cy-gy)*ny;
    if(pen>PMAX){
      const corr=pen-PMAX;b.x+=nx*corr;b.y+=ny*corr;
      const qx=rx-nx*wh.r,qy=ry-ny*wh.r;
      const vn=(b.vx-b.w*qy)*nx+(b.vy+b.w*qx)*ny;
      if(vn<0){const rn=qx*ny-qy*nx,J=-vn/(1+rn*rn/I);b.vx+=J*nx;b.vy+=J*ny;b.w+=rn*J/I;}
    }
  }
  stepTrailer(dt);
  if(live){
    for(const p of HEAD){
      const wx=b.x+p[0]*ca-p[1]*sa,wy=b.y+p[0]*sa+p[1]*ca;
      if(wy<terrainH(wx)+0.3){crash();return;}
    }
    tricks(dt);
  }
}

function groundSolve(hx,hy){ // where the trailer wheel rests on the ground, ARM behind the hitch
  const f=x=>Math.hypot(x-hx,terrainH(x)+TR_R-hy)-ARM;
  let lo=hx-ARM-2,hi2=hx;
  if(f(hi2)>=0)return null; // hitch too high above the ground: trailer hangs freely
  for(let i=0;i<16;i++){const m=(lo+hi2)/2;if(f(m)>=0)lo=m;else hi2=m;}
  const x=(lo+hi2)/2;return [x,terrainH(x)+TR_R];
}
function stepTrailer(dt){
  const ox=tr.x,oy=tr.y,h=rearAxle();
  const vx=(tr.x-tr.px)*0.999,vy=(tr.y-tr.py)*0.999;
  let nx=tr.x+vx,ny=tr.y+vy-G*dt*dt;
  const sol=groundSolve(h[0],h[1]);
  if(sol&&(tr.g||ny<=terrainH(nx)+TR_R+0.5)){ // rolling on the ground behind the bike
    nx=sol[0];ny=sol[1];tr.g=true;
  }else{ // swinging freely in the air
    tr.g=false;
    const dx=nx-h[0],dy=ny-h[1],d=Math.hypot(dx,dy)||1;
    nx=h[0]+dx/d*ARM;ny=h[1]+dy/d*ARM;
    const g=terrainH(nx)+TR_R;
    if(ny<g){ny=g;tr.g=true;}
  }
  { // never in front of the bike: max 100 deg off its axis
    const ca=Math.cos(bike.a),sa=Math.sin(bike.a),dx=nx-h[0],dy=ny-h[1];
    const bx=-(dx*ca+dy*sa),by=-dx*sa+dy*ca,phi=Math.atan2(by,bx),lim=1.75;
    if(Math.abs(phi)>lim){
      const p2=clamp(phi,-lim,lim),lx=-Math.cos(p2)*ARM,ly=Math.sin(p2)*ARM;
      nx=h[0]+lx*ca-ly*sa;ny=h[1]+lx*sa+ly*ca;
    }
  }
  tr.px=ox;tr.py=oy;tr.x=nx;tr.y=ny;
  if(tr.g)tr.spin-=(tr.x-ox)/TR_R;
}

// ================= tricks & boost =================
function tricks(dt){
  const rc=wheels[0].c,fc=wheels[1].c;
  if(!rc&&!fc){
    airT+=dt;airRot+=bike.w*dt;
    if(airT>0.4){charge(0.08*dt);trick+=22*dt;}
    if(wheelieT>0)endWheelie();
  }else{
    if(airT>0.35||(slam&&airT>0.2))land(); // a slam from a tiny hop earns nothing
    airT=0;airRot=0;slam=false;
    if(rc&&!fc&&bike.vx>25){wheelieT+=dt;if(wheelieT>0.5){charge(0.06*dt);trick+=18*dt;}}
    else if(wheelieT>0)endWheelie();
  }
}
function endWheelie(){if(wheelieT>1.2)pop('WHEELIE '+wheelieT.toFixed(1)+'S','#b7f36a');wheelieT=0;}
function land(){
  const n=Math.floor((Math.abs(airRot)+0.9)/TAU);
  const sl=slope(bike.x),ta=Math.atan(sl);
  let d=bike.a-ta;d=((d+Math.PI)%TAU+TAU)%TAU-Math.PI;
  const ad=Math.abs(d);
  let big=false;
  if(n>0){
    const p=150*n;trick+=p;flips+=n;charge(0.34*n);big=true;
    pop((n>1?n+'X ':'')+(airRot>0?'BACKFLIP':'FRONTFLIP')+' +'+p,'#ffd23f');sfx('flip');
    if(airRot>0)st.back+=n;else st.front+=n;st.multi=Math.max(st.multi,n);
  }
  st.air=Math.max(st.air,airT);
  if(airT>1){const p=Math.round(airT*35);trick+=p;charge(0.05);pop('BIG AIR '+airT.toFixed(1)+'S +'+p,'#8fe3ff');}
  // --- landing quality decides your speed (Hill Climb style) ---
  const nl=Math.hypot(1,sl),tx=1/nl,ty=sl/nl;
  const vt=bike.vx*tx+bike.vy*ty;
  let add=0,mult=1;
  if(ad<0.25){        // PERFECT: wheels parallel to the slope -> big push, combo grows
    combo++;const c=Math.min(combo,6);st.perfect++;st.combo=Math.max(st.combo,combo);
    add=(80+25*airT+50*n)*(1+0.35*(c-1));
    momT=1.4+0.3*c;momF=100+55*c;
    trick+=40*c;charge(0.1);
    pop('PERFECT LANDING'+(combo>1?' X'+combo:'')+' +SPEED','#ff9fd1');
    if(!big)sfx('perfect');
  }else if(ad<0.5){   // good: small push, combo kept
    const c=Math.min(combo,6);add=40+25*n+10*c;momT=0.8;momF=80+20*c;
    pop('GOOD LANDING +SPEED','#b7f36a');
  }else if(ad<0.8){   // rough: lose some speed
    combo=0;mult=0.78;pop('ROUGH LANDING -SPEED','#ffc46a');
  }else{              // sloppy: lose a lot
    combo=0;mult=0.45;shake=0.15;pop('SLOPPY LANDING -SPEED','#ff7a5a');
  }
  if(slam){ // slammed into the ground: a short extra push
    slam=false;add+=90;st.slam++;momT=Math.max(momT,1.2);momF=Math.max(momF,220);trick+=30;shake=Math.max(shake,0.12);
    pop('SLAM! +SPEED','#7df9ff');sfx('slam');
  }
  if(vt>0||add>0){
    const target=Math.min(Math.max(vt,0)*mult+add,480);
    const dv=target-vt;
    bike.vx+=dv*tx;bike.vy+=dv*ty;
  }
  const h=rearAxle();climate(h[0]);groundPal();
  dust(h[0],h[1]-5,gEdge,8+(add>0?8:0),60);
}
function charge(v){
  if(boostOn>0||boost>=1)return;
  boost=Math.min(1,boost+v);
  if(boost>=1){pop('BOOST READY!','#ff4fa3');sfx('ready');}
}
function activateBoost(){
  if(state!=='play'||boost<1||boostOn>0)return;
  boostOn=BOOST_T;st.boost++;
  pusher.on=true;pusher.a=0;pusher.leave=null;
  sfx('boost');pop('GO GO GO!','#ff4fa3');
  dust(pusher.hand.x-12,pusher.hand.y-10,[255,255,255],10,50);
}
function endBoost(){
  boostOn=0;boost=0;
  if(pusher.on){pusher.on=false;pusher.leave={x:pusher.hand.x-8,t:0};}
}
function stopRide(snd,msg,col,sh,vib){ // a crash, or Cleo waking up: the ride ends a moment later
  state='crash';crashT=0;shake=sh;sfx(snd);pop(msg,col);
  input.gas=input.brake=false;
  if(boostOn>0)endBoost();
  document.body.classList.remove('play');
  bGas.classList.remove('on');bBrake.classList.remove('on');
  try{navigator.vibrate&&navigator.vibrate(vib);}catch(e){}
}
function crash(){stopRide('crash','CRASH!','#ff5555',0.45,120);}
function cleoWakes(){wakeT=0;overWhy='CLEO WOKE UP!';stopRide('scream','WAAAAH!','#ff9fd1',0.2,[80,60,80,60,160]);}
function keepRiding(){ // after a completed level: carry on with the same ride, upright and standing still
  place(bike.x);napT=0;napArmed=false;
  state='play';winT=0;document.body.classList.add('play');
}
function levelWon(){ // brake to a stop, arms up, confetti; the next level unlocks
  state='win';winT=0;levelDone=true;input.gas=input.brake=false;
  if(boostOn>0)endBoost();
  document.body.classList.remove('play');bGas.classList.remove('on');bBrake.classList.remove('on');
  unlocked=Math.max(unlocked,Math.min(FREE,level+1));saveProgress();clearKept();
  const sc=score();if(sc>hi){hi=sc;newBest=true;try{localStorage.setItem('cleomania_hi',hi);}catch(e){}}
  pop(levelName(level)+' COMPLETE!','#7dff8a');sfx('level');
}
const score=()=>Math.floor(Math.max(0,(maxX-60)/PXM)+trick);
function gameOver(){
  state='over';overT=0;heartLost=outOfHearts=false;
  if(goals().length&&!levelDone){ // failed the level: lose a heart
    hearts--;heartLost=true;
    if(hearts<=0){outOfHearts=true;hearts=HEARTS;clearKept();} // the same level again, from scratch; saved right away, so reloading doesn't dodge it
    saveProgress();
  }

}

function dust(x,y,c,n,sp){

    vx:(Math.random()-0.6)*sp,vy:Math.random()*sp*0.6,l:0,m:0.4+Math.random()*0.4,c:rgb(c)});

// iOS: 'playback' session ignores the ring/silent switch (Safari 17+)
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
    // fresh context after backgrounding: bring the music back if it should be playing
    if(actx&&typeof state!=='undefined'&&state!=='title'&&state!=='paused')musicStart();}
  if(!actx||actx.state==='running')return;
  // iOS also uses 'interrupted' (calls, app switch); resume anything not running
  try{actx.resume();}catch(e){}
  // older iOS only unlocks after a buffer is played inside the gesture
  try{const s=actx.createBufferSource();s.buffer=actx.createBuffer(1,1,22050);s.connect(actx.destination);s.start(0);}catch(e){}
}

['touchend','click'].forEach(ev=>addEventListener(ev,audio,{capture:true,passive:true}));

// so drop it when hidden and let the next tap create a fresh one
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden||!actx)return;
  musicStop();try{actx.close();}catch(e){}
  actx=null;mBus=pBus=noiseBuf=null;
});
function tone(f,d,o={}){
  if(muted||!actx)return;
  const t=actx.currentTime+(o.at||0),os=actx.createOscillator(),g=actx.createGain();
  os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(o.vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  os.connect(g);g.connect(actx.destination);os.start(t);os.stop(t+d+0.05);
}
function sfx(n){
  switch(n){
    case 'flip':tone(660,.07);tone(880,.07,{at:.07});tone(1320,.12,{at:.14});break;
    case 'perfect':tone(988,.08);tone(1318,.1,{at:.08});break;
    case 'ready':tone(523,.1);tone(784,.1,{at:.1});tone(1046,.16,{at:.2});break;
    case 'boost':tone(220,.45,{to:900,type:'sawtooth',vol:.04});break;
    case 'crash':tone(300,.5,{to:40,type:'sawtooth',vol:.07});tone(90,.35,{vol:.05,at:.05});break;
    case 'mile':tone(1046,.06);tone(1318,.1,{at:.07});break;
    case 'slam':tone(160,.16,{to:55,vol:.07});tone(520,.08,{at:.1});tone(780,.12,{at:.16});break;
    case 'level':[523,659,784,1046].forEach((f,i)=>tone(f,.14,{at:i*.11}));tone(1318,.4,{at:.44,vol:.06});tone(784,.4,{at:.44,type:'triangle',vol:.06});break;
    case 'start':tone(440,.08);tone(660,.12,{at:.08});break;
    case 'tick':tone(880,.07,{type:'triangle',vol:.07});break;
    case 'scream':for(let k=0;k<3;k++){const a=k*.62;tone(620,.32,{to:980,type:'sawtooth',vol:.045,at:a});tone(980,.3,{to:520,type:'sawtooth',vol:.045,at:a+.32});tone(310,.6,{to:420,vol:.02,at:a});}break;
    case 'pop':tone(180+Math.random()*120,.18,{to:60,type:'triangle',vol:.05});break;
    case 'finale':[523,659,784,1046,784,1046,1318,1568].forEach((f,i)=>{tone(f,.16,{at:i*.13,vol:.05});tone(f/2,.16,{at:i*.13,type:'triangle',vol:.05});});tone(2093,.6,{at:1.04,vol:.05});break;
  }
}

// ================= update =================
function update(dt){
  time+=dt;
  if(!DBG.still&&(state==='play'||state==='crash'||state==='title'||state==='win')){
    acc+=dt;let n=0;
    while(acc>=DT&&n<24){phys(DT);acc-=DT;n++;}
    if(n>=24)acc=0;
  }
  if(wakeT>=0)wakeT+=dt;
  if(state==='crash'){crashT+=dt;if(crashT>(wakeT>=0?2.4:1.4))gameOver();} // a screaming Cleo takes a little longer
  if(state==='over')overT+=dt;
  if(state==='win'){winT+=dt;
    if(winT<1.8&&Math.random()<0.8){ // confetti from the rider's raised hands
      const ca=Math.cos(bike.a),sa=Math.sin(bike.a),x=bike.x+8*ca-20*sa,y=bike.y+8*sa+20*ca;
      parts.push({x,y,vx:(Math.random()-0.5)*140,vy:40+Math.random()*120,l:0,m:1.4+Math.random()*0.8,
                  c:['#ff5c8a','#ffd23f','#3fc1c9','#7dff8a','#ffffff'][Math.floor(Math.random()*5)]});
    }
    if(level>=LEVELS.length){ // the whole tour is done: fireworks and a fanfare
      if(winT>=2.6&&winT-dt<2.6)sfx('finale');
      if(winT>0.6&&Math.random()<dt*2.5){
        const x=cam.x+W*(0.12+0.76*Math.random()),y=camYi+Hc-H*(0.1+0.3*Math.random()),c=['#ff5c8a','#ffd23f','#3fc1c9','#7dff8a','#ffffff','#b07cd8'][Math.floor(Math.random()*6)];
        for(let k=0;k<26;k++){const a=k/26*TAU,v=40+Math.random()*50;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0,m:1+Math.random()*0.6,c});}
        sfx('pop');
      }
    }}
  if(state==='play'){
    introT+=dt;
    if(introT>=3&&introT-dt<3)goalsT=4; // after the intro card, the checklist stays for a few seconds
    // ...and comes back briefly when a goal makes progress (distance and speed only when they're reached)
    if(!levelDone)goals().forEach((g,i)=>{if(!isKept(i)&&goalDone(g))keepGoal(i);}); // reached goals stay reached
    const sig=goals().map(([k,n],i)=>{const v=GOAL[k][1]();return goalMet([k,n],i)?'D':k==='dist'||k==='reach'||k==='speed'||k==='score'?'':Math.min(v,n).toFixed(1);}).join();
    if(sig!==goalSig){if(goalSig&&introT>=3)goalsT=3;goalSig=sig;}
  }
  goalsT=Math.max(0,goalsT-dt);
  if(state==='play'&&!levelDone&&goals().length&&wheels[0].c&&wheels[1].c&&goals().every(goalMet))levelWon(); // all goals, back on the ground
  if(state==='play'){
    maxX=Math.max(maxX,bike.x);
    st.speed=Math.max(st.speed,Math.hypot(bike.vx,bike.vy)/PXM*3.6);
    const m=Math.floor((maxX-60)/PXM/100);
    if(m>lastMile){lastMile=m;flash=0.9;sfx('mile');}
    { // Cleo sleeps while the bike rolls; too slow for long and she wakes up
      const kmh=Math.hypot(bike.vx,bike.vy)/PXM*3.6;
      if(!napArmed&&(kmh>=WAKE_KMH||introT>8)){napArmed=true; // armed once the ride is under way
        if(!napTold){napTold=true;pop('ABOVE 40 KM/H: CLEO SLEEPS','#ff9fd1');}} // the rule, once per session
      if(napArmed&&kmh<WAKE_KMH){const t0=napT;napT+=dt;

    }

    if(seg!==segShown){segShown=seg;banner={text:segName(seg),t:0};musicBiome();}
    if(wheels[0].c&&input.gas&&wheels[0].vt>40&&Math.random()<0.45){
      const h=rearAxle();climate(h[0]);groundPal();dust(h[0],h[1]-5,gEdge,1,40);
    }
  }
  updButtons();
  if(pusher.on){
    pusher.a=Math.min(1,pusher.a+dt*4);

  // camera

  camOff+=(((boostOn>0||pusher.on||pusher.leave)?0.47:0.3)-camOff)*Math.min(1,dt*2.5);

}

  const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy)||0.001,dd=Math.min(d,l1+l2-0.01);
  const base=Math.atan2(dy,dx),a=Math.acos(clamp((l1*l1+dd*dd-l2*l2)/(2*l1*dd),-1,1));
  const k1x=ax+l1*Math.cos(base+a),k1y=ay+l1*Math.sin(base+a),k2x=ax+l1*Math.cos(base-a),k2y=ay+l1*Math.sin(base-a);
  const pick=(k1x*px+k1y*py)>(k2x*px+k2y*py);
  return [pick?k1x:k2x,pick?k1y:k2y,ax+dx/d*dd,ay+dy/d*dd];

const nSuit=new Float32Array(NICHE.length);
const DCS=44;
function decorCand(c){ // deterministic candidate for cell c, or null
  const x=c*DCS+hash(c,SEED+601)*24;if(x<ELX+70)return null; // keep the start and the Elisenbrunnen clear
  climate(x);
  const wild=1-sstep(0.3,0.7,pU); // nature gives way to the city
  let tot=0,best=0;
  for(let k=0;k<NICHE.length;k++){const n=NICHE[k][2]()*(NICHE[k][3]?1:wild);nSuit[k]=n*NICHE[k][1];tot+=nSuit[k];if(n>best)best=n;}
  if(tot<=0)return null;
  const dens=0.34+0.46*sstep(0.25,0.85,pM)+0.12*bump(pM,0.15,0.5)*bump(pT,0.5,0.9)+0.14*bump(pS,0.3,0.85); // lusher, savanna, dunes: more
  const grove=clamp(0.5+0.9*noise(x/380,SEED+620),0,1);            // groves and clearings
  if(hash(c,SEED+602)>dens*(0.45+0.9*grove)*best*(1-0.3*wild)*(1+0.38*sstep(0.5,0.8,pS)))return null; // thins out at niche edges; 30% sparser outside the city, 30% more on the beach
  let q=hash(c,SEED+603)*tot,sp=NICHE[NICHE.length-1][0];
  for(let k=0;k<NICHE.length;k++){q-=nSuit[k];if(q<0){sp=NICHE[k][0];break;}}
  const kind=KIND.get(sp)||'small',sc=DSCALE*(kind==='tree'?0.88+0.24*hash(c,SEED+607):TINY.has(sp)?0.6:1); // trees vary in size
  const w=Math.round(sp.width*sc),h=Math.round(sp.height*sc);
  const xl=x-w/2+1,xr=x+w/2-1,hl=terrainH(xl),hm=terrainH(x),hr=terrainH(xr);
  const steep=Math.max(Math.abs(hr-hl)/Math.max(1,xr-xl),Math.abs(slope(x)));
  const maxS=kind==='build'?0.22:kind==='animal'?0.3:kind==='tree'?0.75:0.9;
  if(steep>maxS)return null;
  biome(x);const rb=bT<0.5?bA:bB;
  if(rampsOf(rb,xl)+rampsOf(rb,x)+rampsOf(rb,xr)>0.5)return null; // keep kickers clean
  return {x,sp,kind,w,h,ground:Math.min(hl,hm,hr),pri:hash(c,SEED+605),flip:hash(c,SEED+606)<0.5};
}
function decorBlocks(a,b){ // can these two not stand together?
  if(Math.abs(a.x-b.x)>=(a.w+b.w)/2+2)return false;
  if(a.kind==='small'&&b.kind==='small')return false;
  if((a.kind==='small'&&b.kind==='tree')||(a.kind==='tree'&&b.kind==='small'))return false;
  return true;
}
const ELX=250; // the Elisenbrunnen stands right where every ride starts
const HOUSES=[SPR.house1,SPR.house2,SPR.house3,SPR.house4,SPR.house5],HCELL=44;
function drawStreet(){ // Aachen's town houses, side by side in one slot per HCELL world px; gaps grow as the city ends
  const c0=Math.floor((camXi-30)/HCELL),c1=Math.floor((camXi+W+30)/HCELL);
  for(let c=c0;c<=c1;c++){
    const x=c*HCELL+HCELL/2;if(x<ELX+70||x>AL)continue;
    climate(x);if(hash(c,SEED+640)>0.95*sstep(0.5,0.9,pU))continue;
    const sp=HOUSES[Math.floor(hash(c,SEED+641)*HOUSES.length)],w=Math.round(sp.width*DSCALE),h=Math.round(sp.height*DSCALE);
    const xl=x-w/2+1,xr=x+w/2-1,hl=terrainH(xl),hm=terrainH(x),hr=terrainH(xr);
    if(Math.abs(hr-hl)/(xr-xl)>0.3)continue;                                          // too steep for a house
    if(rampsOf(AACHEN,xl)+rampsOf(AACHEN,x)+rampsOf(AACHEN,xr)>0.5)continue;           // keep kickers clean
    ctx.drawImage(hash(c,SEED+642)<0.5?flipped(sp):sp,Math.round(x-camXi-w/2),Math.round(Hc-(Math.min(hl,hm,hr)-camYi))-h+3,w,h);
  }
}
function drawDecor(){
  if(camXi<AL)drawStreet();
  { const sp=SPR.elisen,w=Math.round(sp.width*DSCALE),h=Math.round(sp.height*DSCALE),sx=Math.round(ELX-camXi-w/2);
    if(sx<W&&sx+w>0){const g=Math.min(terrainH(ELX-w/2+1),terrainH(ELX),terrainH(ELX+w/2-1));ctx.drawImage(sp,sx,Math.round(Hc-(g-camYi))-h+3,w,h);} }
  const c0=Math.floor((camXi-50)/DCS),c1=Math.floor((camXi+W+50)/DCS);
  let prev=decorCand(c0-1),cur=decorCand(c0);
  for(let c=c0;c<=c1;c++){
    const next=decorCand(c+1);
    if(cur&&!((prev&&prev.pri>cur.pri&&decorBlocks(cur,prev))||(next&&next.pri>cur.pri&&decorBlocks(cur,next)))){
      const sx=Math.round(cur.x-camXi-cur.w/2),sy=Math.round(Hc-(cur.ground-camYi))-cur.h+3;
      ctx.drawImage(cur.flip&&cur.sp!==SPR.cabin?flipped(cur.sp):cur.sp,sx,sy,cur.w,cur.h);
      if(cur.sp===SPR.cabin){ // chimney smoke
        ctx.fillStyle='rgba(235,235,235,.75)';
        for(let k=0;k<4;k++){const ph=(time*0.6+k*0.25)%1;ctx.fillRect(Math.round(sx+cur.w*0.72+Math.sin(time*2+k)*2+ph*6),Math.round(sy-ph*16),2+(k>1?1:0),2);}
      }

  }
}
function drawGround(){
  let prevGy=terrainH(camXi-1),cell=NaN,cTop,cEdge,soil,dark;
  for(let i=0;i<W;i++){
    const wx=camXi+i,gy=terrainH(wx),sl=gy-prevGy;prevGy=gy;
    const y0=Math.round(Hc-(gy-camYi));if(y0>=H)continue;
    if(Math.floor(wx/8)!==cell){ // the climate changes slowly: sample it every 8 world px
      cell=Math.floor(wx/8);climate(cell*8);groundPal();
      cTop=rgbc(gTop);cEdge=rgbc(gEdge);soil=rgbc(gSoil);dark=rgbc(gDark);
    }
    let top=cTop,edge=cEdge;
    // snow on high, cold, mountainous ground; the snowline rises smoothly as the climate warms
    const snow=(1-sstep(0.12,0.26,pT))*sstep(0.55,0.8,pE);
    if(gy>125+(1-snow)*400+6*noise(wx/70,SEED+913)&&Math.abs(sl)<0.9){top='#e3edfb';edge='#ffffff';}
    ctx.fillStyle=soil;ctx.fillRect(i,y0+4,1,H-y0-4);
    ctx.fillStyle=top;ctx.fillRect(i,y0+1,1,3);
    ctx.fillStyle=edge;ctx.fillRect(i,y0,1,1);
    ctx.fillStyle=dark;ctx.fillRect(i,y0+4,1,1);
    const cx=((wx%3)+3)%3; // cobblestones in the city: staggered joints, fading out with the city
    if(pU>0.02&&hash(Math.floor(wx/3),SEED+930)<pU*1.2){if(cx===0)ctx.fillRect(i,y0+1,1,2);if(cx===2)ctx.fillRect(i,y0+3,1,1);}
    if(noise(wx/60,SEED+907)>-0.15)ctx.fillRect(i,y0+17+Math.round(3*noise(wx/30,SEED+903)),1,1);   // patchy soil layers
    if(noise(wx/80,SEED+908)>0.1)ctx.fillRect(i,y0+33+Math.round(5*noise(wx/45,SEED+905)),1,1);
    if(noise(wx/50,SEED+909)>0.45)ctx.fillRect(i,y0+48+Math.round(4*noise(wx/35,SEED+910)),1,1);
    const st=hash(Math.floor(wx/4),SEED+911);
    if(st<0.035){ctx.fillStyle=rgbc(mix(gDark,[170,165,150],0.55));ctx.fillRect(i,y0+12+Math.floor(hash(Math.floor(wx/4),SEED+912)*40),1,2);} // buried stones
    for(let k=0;k<3;k++)if(hash(wx*3+k,SEED+900)<0.33)ctx.fillRect(i,y0+6+k*13+Math.floor(hash(wx*3+k,SEED+901)*11),1,1);
    if(hash(wx,SEED+904)<0.035){ctx.fillStyle='#b9b2a6';ctx.fillRect(i,y0+8+Math.floor(hash(wx,SEED+906)*24),2,1);} // pebbles
    const hv=hash(wx,SEED+902);
    if(hv<0.07*(1-pU)){ctx.fillStyle=top;ctx.fillRect(i,y0-1,1,1);}                  // grass tufts (not on cobblestones)
    const dry=bump(pM,0.2,0.48)*bump(pT,0.5,0.85),leafy=bump(pM,0.62,1)*bump(pT,0.3,0.55),shore=sstep(0.6,0.95,pS);
    if(hv>1-0.07*dry){ctx.fillStyle='#d8c46a';ctx.fillRect(i,y0-1,1,1);}                         // dry savanna grass
    if(hv>1-0.1*leafy){ctx.fillStyle=hv>1-0.04*leafy?'#d9822b':'#b5452b';ctx.fillRect(i,y0+1,1,1);} // fallen leaves
    if(hv>1-0.03*shore){ctx.fillStyle='#ffffff';ctx.fillRect(i,y0+2,1,1);}                       // shells
  }
}

function wheel(x,y,s,r){
  ctx.strokeStyle='#161616';ctx.lineWidth=1.8;circ(x,y,r-0.9);ctx.stroke();
  ctx.strokeStyle='#a7adb6';ctx.lineWidth=0.8;circ(x,y,r-2.1);ctx.stroke();
  ctx.strokeStyle='#d7dbe0';ctx.lineWidth=0.6;
  for(let k=0;k<3;k++){const a=s+k*Math.PI/3,c=Math.cos(a)*(r-2.2),d=Math.sin(a)*(r-2.2);seg(x+c,y+d,x-c,y-d);}
  ctx.fillStyle='#333';circ(x,y,0.9);ctx.fill();
}
function leg(hx,hy,fx,fy,cs,ck,csh){

}

  ctx.save();ctx.translate(tr.x-camXi,Hc-(tr.y-camYi));ctx.rotate(-ang);
  ctx.lineCap='round';ctx.lineJoin='round';

  const fw=Math.sin(time*14)*1.2;
  ctx.fillStyle='#d62839';poly([[-11,33],[-17.5,31.5+fw],[-10.7,29]]);ctx.fill();
  // hitch arm

  // body: black fabric, tan lower panel, mesh window
  ctx.fillStyle='#25282d';
  poly([[-8.5,-2],[-10,6],[-10,12],[-8,17],[-4,19.5],[2,19.5],[6,16.5],[8.5,11],[9,3],[7,-2]]);ctx.fill();
  ctx.fillStyle='#b89c6b';poly([[-8.5,-2],[-9.7,4],[8.9,4],[7,-2]]);ctx.fill();
  ctx.fillStyle='#6b7480';poly([[-7.5,5],[-7.5,12.5],[-5.5,16.5],[1.5,17],[5.5,14],[6.5,9],[6.5,5]]);ctx.fill();
  // Cleo inside: asleep while the bike rolls, stirring when it's too slow, screaming once awake
  const awake=wakeT>=0,stir=awake?Math.sin(time*40)*0.6:napT>0?Math.sin(time*25)*0.5*Math.min(1,napT/(WAKE_GRACE+WAKE_T)):0;
  ctx.save();ctx.translate(stir,0);

  ctx.fillStyle='#ff8fab';ctx.beginPath();ctx.arc(-0.5,-10.9,2.6,Math.PI,TAU);ctx.fill();

  if(awake){ctx.fillStyle='#6a1424';ctx.fillRect(0.7,-9.5,1.3,1.1); // a wide-open mouth and tears
    ctx.fillStyle='#8fd3f4';ctx.fillRect(1.5,-10.2+(time*5)%2.2,0.6,0.8);}
  ctx.restore();
  ctx.strokeStyle='rgba(30,32,36,.5)';ctx.lineWidth=0.5;
  for(const x of [-5,-2,1,4])seg(x,5,x,16.5);
  seg(-7.5,9,6.5,9);seg(-7,13,5.5,13);
  ctx.strokeStyle='#c9ced4';ctx.lineWidth=1.2;seg(-9.4,4.4,8.8,4.4);seg(-9.6,-0.6,8.2,-0.6); // aluminium frame
  // push handle
  ctx.strokeStyle='#c9ced4';ctx.lineWidth=1.3;seg(-8.8,15,-12.5,19.5);
  ctx.strokeStyle='#111';ctx.lineWidth=1.8;seg(-12.5,19.5,-13.6,19.8);
  wheel(0,0,tr.spin,6);
  ctx.restore();
  if(wakeT<0&&napT===0&&state!=='over')for(let k=0;k<2;k++){ // sleeping: little z's float up from the trailer
    const ph=(time*0.55+k*0.5)%1,x=Math.round(tr.x-camXi+3+ph*6),y=Math.round(Hc-(tr.y-camYi)-23-ph*10);
    ctx.globalAlpha=Math.sin(ph*Math.PI)*0.85;ctx.fillStyle='#ffffff';
    ctx.fillRect(x,y,3,1);ctx.fillRect(x+1,y+1,1,1);ctx.fillRect(x,y+2,3,1);

}
function wleg(hx,hy,fx,fy,c1,c2,c3){

  ctx.strokeStyle=c2;ctx.lineWidth=1.8;wseg(k[0],k[1],k[2],k[3]);
  ctx.strokeStyle=c3;ctx.lineWidth=1.4;wseg(k[2]-0.8,k[3],k[2]+1.8,k[3]);
}
function warm(sx,sy,hx,hy,c1,c2){

  ctx.strokeStyle=c1;ctx.lineWidth=1.8;wseg(sx,sy,k[0],k[1]);

function drawPusher(P,alpha,who){ // whoever isn't riding, in the same kit as on the bike
  const L=LOOK[who],man=who==='man';
  ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
  const [hx,hy]=P.hip,[sx,sy]=P.sh,[qx,qy]=P.head;

  if(!man){ // blonde ponytail
    const w=Math.sin(time*16);
    ctx.strokeStyle='#ffd166';ctx.lineWidth=1.8;ctx.beginPath();
    ctx.moveTo(WX(qx-1.8),WY(qy+0.8));ctx.quadraticCurveTo(WX(qx-4.5),WY(qy+1.8+w*0.6),WX(qx-7.5),WY(qy-0.2+w*1.3));ctx.stroke();
    ctx.strokeStyle='#e9b949';ctx.lineWidth=0.7;ctx.beginPath();

  }else for(const [t,o,c] of [[0.25,0.6,'#ff5c8a'],[0.45,-0.7,'#3fc1c9'],[0.62,0.5,'#ffd23f'],[0.8,-0.4,'#ff5c8a']]){
    ctx.fillStyle=c;ctx.fillRect(Math.round(WX(hx+(sx-hx)*t+o)),Math.round(WY(hy+(sy-hy)*t)),1,1);}
  ctx.fillStyle=L.sh;wcirc(hx,hy,2);ctx.fill();
  wleg(hx,hy,P.f1[0],P.f1[1],L.sh,L.sk,L.shoe);
  // head
  ctx.strokeStyle=L.sk;ctx.lineWidth=1.6;wseg(sx,sy,qx-0.3,qy-1);
  if(!man){ctx.fillStyle='#ffd166';wcirc(qx-0.8,qy+0.1,2.5);ctx.fill();}
  ctx.fillStyle=L.sk;wcirc(qx+0.5,qy-0.2,2);ctx.fill();
  if(man){ctx.fillStyle='#7a5634';ctx.beginPath();ctx.arc(WX(qx+0.6),WY(qy-0.3),2,0.08*Math.PI,0.82*Math.PI);ctx.fill();} // beard
  else{ctx.fillStyle='#ffd166';ctx.fillRect(Math.round(WX(qx-0.2)),Math.round(WY(qy+1.6)),2,1);}
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(WX(qx),WY(qy+0.5),2.6,Math.PI,TAU);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(Math.round(WX(qx-1)),Math.round(WY(qy+2.6)),2,1);
  ctx.strokeStyle='#111';ctx.lineWidth=1;wseg(qx+0.7,qy+0.1,qx+2.4,qy);
  warm(sx,sy,P.h1[0],P.h1[1],L.j,L.arm);
  ctx.restore();
}
function pushPose(hand,phase,grounded){
  let sx=hand.x-6.5,sy=hand.y+0.8,hx=sx-4.6,hy=sy-8.8;
  if(grounded){const dy=terrainH(hx)+11.4-hy;hy+=dy;sy+=dy;}
  const d=Math.hypot(hand.x-sx,hand.y-sy);
  if(d>8.4){const k=8.4/d,nx=hand.x+(sx-hand.x)*k,ny=hand.y+(sy-hand.y)*k;hx+=nx-sx;hy+=ny-sy;sx=nx;sy=ny;}
  const f=[];
  for(let k=0;k<2;k++){
    const ph=phase+k*Math.PI;let fx,fy;
    if(grounded){fx=hx+4.6*Math.sin(ph);fy=terrainH(fx)+0.9+Math.max(0,Math.cos(ph))*3;}
    else{fx=hx-3.5+1.5*Math.sin(ph*0.6);fy=hy-10.5;}
    f.push([fx,fy]);
  }
  return {hip:[hx,hy],sh:[sx,sy],head:[sx+2.3,sy+3.4],f1:f[0],f2:f[1],h1:[hand.x,hand.y],h2:[hand.x-0.6,hand.y+0.2]};
}
function wavePose(x){
  const g=terrainH(x),hy=g+11.6,sx=x+0.8,sy=hy+9,wv=Math.sin(time*14)*1.6;
  return {hip:[x,hy],sh:[sx,sy],head:[sx+0.6,sy+3.6],f1:[x+1.8,terrainH(x+1.8)+0.9],f2:[x-1.6,terrainH(x-1.6)+0.9],
          h1:[sx+2.5+wv,sy+7.5],h2:[sx-1,sy-7.6]};
}

  txt('AACHEN TO THE MATTERHORN',W/2,y+58,'#8fe3ff',8,'center');
  txt('AND CLEO SLEPT TIGHT',W/2,y+69,'#ff9fd1',8,'center');
  txt('SCORE '+pad5(score())+(newBest?'  NEW BEST!':''),W/2,y+84,newBest?'#ffd23f':'#ffffff',8,'center');
  winButtons(w,y+113,true);
}
function winButtons(w,y,last){ // two choices: left half keeps riding, right half goes on
  if(winT<=3.2)return;
  const bw=Math.min(112,Math.floor((w-18)/2));
  [[touch?'KEEP RIDING':'R: RIDE ON',W/2-bw/2-4,'#8fe3ff'],[touch?(last?'FREE RIDE':'NEXT LEVEL'):'SPACE: NEXT',W/2+bw/2+4,'#ffd23f']].forEach(([t,cx,c])=>{
    ctx.strokeStyle=c;ctx.lineWidth=1;ctx.strokeRect(Math.round(cx-bw/2)+0.5,y+0.5,bw-1,15);
    txt(t,cx,y+4,c,8,'center');
  });
}

// ================= render =================
function render(){
  camXi=Math.round(cam.x);camYi=Math.round(cam.y);
  biome(cam.x+W*0.5);const cA=bA,cB=bB,cT=bT;
  ctx.save();
  if(shake>0)ctx.translate(Math.round((Math.random()-0.5)*8*shake),Math.round((Math.random()-0.5)*8*shake));
  drawSky(cA,cB,cT);
  drawBackdrop();
  drawDecor();
  drawGround();
  drawTrailer();
  if(pusher.on){
    const hand={x:pusher.hand.x-(1-pusher.a)*22,y:pusher.hand.y};
    drawPusher(pushPose(hand,pusher.phase,pusher.gT>0),pusher.a,pusherWho());
  }
  if(pusher.leave)drawPusher(wavePose(pusher.leave.x),clamp(1-(pusher.leave.t-0.8)/1,0,1),pusherWho());
  drawBike();
  for(const p of parts){
    ctx.globalAlpha=clamp(1-p.l/p.m,0,1);ctx.fillStyle=p.c;
    ctx.fillRect(Math.round(p.x-camXi),Math.round(Hc-(p.y-camYi)),2,2);
  }
  ctx.globalAlpha=1;
  if(boostOn>0||speedFx>0){
    ctx.fillStyle=boostOn>0?'rgba(255,255,255,.55)':'rgba(255,200,230,'+(0.7*Math.min(1,speedFx/0.4)).toFixed(2)+')';
    for(let k=0;k<12;k++){
      const y=Math.floor(hash(k,SEED+77)*H),x=Math.floor(W-((time*520+hash(k,SEED+78)*W*2)%(W+60)));
      ctx.fillRect(x,y,14+Math.floor(hash(k,SEED+79)*12),1);
    }
  }
  ctx.restore();
  if(state!=='title')drawHUD();
  if(DBG.overlay)drawDebug();
  if(state==='title')drawTitle();
  else if(state==='over')drawOver();
  else if(state==='win')drawWon();
  else if(state==='paused'){
    const G=goals(),gh=G.length?G.length*11+30:0,y=panel(Math.min(W-16,220),46+gh);
    outlined('PAUSED',W/2,y+8,16,'#ffd23f','#e63946');
    if(G.length){ // the level's goals with progress, and the hearts left
      txt(levelName(level)+(levelDone?' COMPLETE!':' GOALS'),W/2,y+30,levelDone?'#7dff8a':'#ffd23f',8,'center');
      const lw=Math.max(...G.map((q,i)=>GOAL[q[0]][2](goalVal(q,i),q[1]).length))*8+8,x0=Math.round(W/2-lw/2);
      G.forEach(([k,n],i)=>{
        const g=GOAL[k],v=goalVal([k,n],i),done=v>=n,yy=y+43+i*11,col=done?'#7dff8a':'#ffffff';
        if(done){ctx.fillStyle=col;ctx.fillRect(x0,yy+4,2,2);ctx.fillRect(x0+2,yy+5,1,2);ctx.fillRect(x0+3,yy+3,1,3);ctx.fillRect(x0+4,yy+1,1,3);}
        else{ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.strokeRect(x0+0.5,yy+1.5,4,5);}
        txt(g[2](v,n),x0+8,yy,col);
      });
      drawHearts(W/2-11,y+44+G.length*11,1,-1);
    }
    txt(touch?'TAP TO RESUME':'P TO RESUME',W/2,y+30+gh,'#ffffff',8,'center');
  }
}

// ================= main loop =================
reset();
if(DBG.x){place(DBG.x);begin();}
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  const t0=performance.now();
  if(state!=='paused')update(dt);
  render();
  if(DBG.overlay)DBG.ms+=(performance.now()-t0-DBG.ms)*0.05;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
